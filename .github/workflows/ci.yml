name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 规则引擎的卡片数据和效果脚本（ProjectIgnis）写到 public/engine/，测试也要用
      - run: npm run sync-engine
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
